# Bars on Broadway - automated AI lineup sync (free, via GitHub Actions).
# Lives at: .github/workflows/lineup_sync.yml
#
# Required repository secrets:
#   WP_USERNAME              - WordPress scraper user (e.g. lineup-bot)
#   WP_APP_PASSWORD          - WordPress Application Password
#   AI_API_KEY               - free Gemini API key
#   META_IG_USER_ID          - Instagram Business Account ID
#   META_PAGE_ACCESS_TOKEN   - long-lived Page Access Token
#   META_FB_PAGE_ID          - Facebook Page ID (enables FB Page posts)

name: Bars on Broadway - AI Lineup Sync

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install Pillow

      - name: Daily Instagram + FB post
        if: github.event.schedule == '0 15 * * *' || github.event_name == 'workflow_dispatch'
        env:
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python social_poster.py

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run scraper
        continue-on-error: true
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python broadway_scraper.py
