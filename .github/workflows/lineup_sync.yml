# Bars on Broadway - automated AI lineup sync (free, via GitHub Actions).
# Lives at:  .github/workflows/lineup_sync.yml
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   WP_USERNAME       - the WordPress scraper user (e.g. lineup-bot)
#   WP_APP_PASSWORD   - that user's WordPress Application Password
#   AI_API_KEY        - free Gemini API key from aistudio.google.com
#
# GitHub Actions cron runs in UTC and does NOT observe daylight saving.
# 0 11 UTC = 6:00 AM Central and 0 22 UTC = 5:00 PM Central while Central
# Daylight Time is in effect; both shift one hour earlier under standard time.
# The script auto-detects morning vs evening from Central time, so the run
# TYPE is always correct - only the wall-clock minute drifts seasonally.

name: Bars on Broadway - AI Lineup Sync

on:
  schedule:
    - cron: '0 11 * * *'   # ~6:00 AM Central - morning sweep
    - cron: '0 22 * * *'   # ~5:00 PM Central - evening delta
  workflow_dispatch:        # manual "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Downloads the Chromium binary Playwright needs to render the
      # JavaScript-built calendars (The Stage on Broadway, Legends Corner).
      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run script
        env:
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python broadway_scraper.py
