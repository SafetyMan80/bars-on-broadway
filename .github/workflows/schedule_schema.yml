# Bars on Broadway - daily 7-day MusicEvent schema page (schedule_schema.py).
# Lives at: .github/workflows/schedule_schema.yml
#
# Runs 30 min AFTER the morning lineup_sync so it reads fresh data. Reads the
# live_lineup posts the scraper already wrote and refreshes ONE evergreen
# events page with 7 days of MusicEvent JSON-LD. Does NOT scrape or modify
# lineup data; read-only against WordPress. Same WP_* secrets.

name: Bars on Broadway - Daily Schema Page

on:
  schedule:
    # 15:30 UTC daily = 30 min after the 15:00 UTC morning lineup_sync run.
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh weekly schema page
        env:
          WP_BASE_URL: https://barsonbroadway.com
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python schedule_schema.py
